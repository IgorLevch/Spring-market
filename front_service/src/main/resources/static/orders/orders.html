<div>
    <p></p>
    <h3>List of Orders</h3>     <!--заголовок 3го уровня-->

    <p></p>




    <table class="table table-hover" cellpadding="0" cellspacing="0">    <!--идет табличка -->
        <tr>
            <td>Order number</td>
            <td>Delivery address</td>
            <td>Telephone</td>
            <td>Price</td>

        </tr>
        <tbody>
        <tr ng-repeat="order in orders">    <!-- tr - это строка в таблице-->
            <td>{{order.id}}</td>    <!-- {{}}  - означает обращение к полю id объекта p; две фигурные скобки на это указывают-->
            <td>{{order.address}}</td>    <!--  ng-repeat  - это цикл foreach в ангуляре-->
            <td>{{order.phone}}</td>
            <td>{{order.totalPrice}}</td>

        </tr>

        </tbody>
    </table>


</div>
