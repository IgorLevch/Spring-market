server:
  port: 5555
  # есть файл с объяснением всех строк этого конфига
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:  "http://localhost:3000"
            allowedMethods:
              -GET
              -POST
            allowedHeaders:  "*"
      routes:
        - id: core_service
          uri: http://localhost:8189/
          predicates:
            - Path=/core/**
          filters:
            - StripPrefix=1
            - PrefixPath=/winter-market-core
            - JwtAuthFilter
        - id: cart_service
          uri: http://localhost:8190/
          predicates:
            - Path=/cart/**
          filters:
            - StripPrefix=1
            - PrefixPath=/winter-market-carts
            - JwtAuthFilter
        - id: auth_service
          uri: http://localhost:8188/
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
            - PrefixPath=/winter-market-auth
            - JwtAuthFilter


